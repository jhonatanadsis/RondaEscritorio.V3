<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#e63854">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ronda Salas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<title>Ronda de Salas — Serasa v3.8</title>
<style>
:root {
  --bg: #f5f7f9; --sur: #ffffff; --sur2: #fdfdfe; --bor: #e0e6ed;
  --primary: #e63854; --primary-light: #fcdde2; --text: #2d3436;
  --muted: #636e72; --green: #00b894; --red: #d63031; --amber: #fdcb6e;
  --shadow: rgba(0,0,0,0.05);
}
[data-theme="dark"] {
  --bg: #050d1a; --sur: #0a1628; --sur2: #0f1e35; --bor: #1a3050;
  --primary: #e63854; --primary-light: rgba(230, 56, 84, 0.2);
  --text: #e8f0ff; --muted: #5a7090; --green: #00e676; --red: #ff3d5a;
  --amber: #ffaa00; --shadow: rgba(0,0,0,0.3);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;transition:0.3s}
.shell{max-width:440px;margin:0 auto;padding-bottom:100px;min-height:100vh;position:relative}
.hdr{background:var(--sur);padding:15px 20px;border-bottom:1px solid var(--bor);display:flex;justify-content:space-between;align-items:center}
.hdr-brand{font-weight:800;font-size:18px;color:var(--primary)}
.theme-toggle{background:var(--sur2);border:1px solid var(--bor);padding:8px;border-radius:10px;cursor:pointer}
.tabs{display:flex;background:var(--sur);border-bottom:1px solid var(--bor);position:sticky;top:0;z-index:10}
.tab{flex:1;padding:15px 5px;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--muted);border:none;background:none;border-bottom:3px solid transparent;cursor:pointer}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.card{background:var(--sur);border-radius:16px;padding:20px;margin:15px;box-shadow:0 4px 15px var(--shadow)}
.card-title{font-weight:800;font-size:16px;margin-bottom:12px}
.btn{width:100%;padding:15px;border-radius:12px;font-weight:700;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-transform:uppercase;transition:0.2s}
.btn.prim{background:linear-gradient(135deg,#f093a2,var(--primary));color:white}
.btn.ghost{background:transparent;border:1px solid var(--bor);color:var(--muted)}
.cklist{display:flex;flex-direction:column;gap:10px}
.ck{display:flex;align-items:center;padding:12px;background:var(--sur2);border-radius:10px;justify-content:space-between;border:1px solid var(--bor)}
.tb{width:42px;height:36px;border-radius:8px;border:1px solid var(--bor);background:var(--sur);color:var(--muted);cursor:pointer;font-weight:bold}
.tb.ok-a{background:var(--green);color:white;border-color:var(--green)}
.tb.fail-a{background:var(--red);color:white;border-color:var(--red)}
.app-footer{position:absolute;bottom:20px;width:100%;text-align:center;pointer-events:none}
.signature{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);opacity:0.6;text-transform:uppercase}
#reader{width:100%;border-radius:12px;overflow:hidden;background:#000;margin-top:10px}
.hidden{display:none!important}
#qrGrid{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:10px}
.qr-item{background:white;padding:10px;border-radius:8px;text-align:center;color:#333}
</style>
</head>
<body data-theme="light">
<div class="shell">
  <header class="hdr">
    <div><div class="hdr-brand">Ronda de Salas</div><div style="font-size:10px;color:var(--muted)">SERASA EXPERIAN</div></div>
    <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">🌙</button>
  </header>
  <nav class="tabs">
    <button class="tab active" id="t-ronda" onclick="showPage('ronda')">Ronda</button>
    <button class="tab" id="t-qr" onclick="showPage('qrcode')">QR Code</button>
    <button class="tab" id="t-hist" onclick="showPage('historico')">Histórico</button>
  </nav>
  <main class="content">
    <div class="page active" id="page-ronda">
      <div id="step1">
        <div class="card">
          <div class="card-title">📍 Local da Ronda</div>
          <select id="selLocal" class="btn ghost" style="margin-bottom:15px;width:100%" onchange="checkLocal()">
            <option value="">Selecione o Escritório</option>
            <option value="BNU">Blumenau</option>
            <option value="PDC">PDC (São Paulo)</option>
          </select>
          <button class="btn prim" id="btnIniciar" onclick="iniciarRonda()" disabled>Iniciar Conferência</button>
        </div>
        <div class="card">
          <div class="card-title">📷 Escanear QR</div>
          <div id="reader"></div>
        </div>
      </div>
      <div id="step2" class="hidden">
        <div id="sectionChecklist" class="hidden">
          <div class="card">
            <div class="card-title" id="salaNomeDisplay">SALA</div>
            <div class="cklist">
              <div class="ck"><span>📷 Câmera</span><div style="display:flex;gap:5px"><button class="tb" id="b-cam-ok" onclick="setCheck('camera','ok')">✓</button><button class="tb" id="b-cam-fail" onclick="setCheck('camera','fail')">✗</button></div></div>
              <div class="ck"><span>🔊 Áudio</span><div style="display:flex;gap:5px"><button class="tb" id="b-aud-ok" onclick="setCheck('audio','ok')">✓</button><button class="tb" id="b-aud-fail" onclick="setCheck('audio','fail')">✗</button></div></div>
              <div class="ck"><span>📺 TV</span><div style="display:flex;gap:5px"><button class="tb" id="b-tv-ok" onclick="setCheck('tv','ok')">✓</button><button class="tb" id="b-tv-fail" onclick="setCheck('tv','fail')">✗</button></div></div>
              <div class="ck"><span>🔌 Cabos</span><div style="display:flex;gap:5px"><button class="tb" id="b-cab-ok" onclick="setCheck('cabos','ok')">✓</button><button class="tb" id="b-cab-fail" onclick="setCheck('cabos','fail')">✗</button></div></div>
            </div>
            <button class="btn prim" id="btnSalvarSala" onclick="concluirSala()" style="margin-top:15px" disabled>Salvar Sala</button>
          </div>
        </div>
        <div id="salasList"></div>
      </div>
    </div>
    <div class="page hidden" id="page-qrcode"><div class="card"><div class="card-title">Gerador</div><div id="qrGrid"></div></div></div>
    <div class="page hidden" id="page-historico"><div id="histContent"></div></div>
  </main>
  <footer class="app-footer"><div class="signature">Desenvolvido por: JSDS</div></footer>
</div>

<script>
const SALAS = {
  BNU:['1ºR.01 - FEIRÃO 01','1ºR.02 - FEIRÃO 02','1ºR.03 - FEIRÃO 03','1ºR.04 - PREMIUM','1ºR.05 - EMPRESTIMO','1ºM.01 - CRÉDITO','1ºM.02 - DÉBITO','1ºF.01 - FOCO 01','1ºF.02 - FOCO 02','1ºF.03 - FOCO 03','1ºF.04 - FOCO 04','1ºAUD - AUDITÓRIO','2ºR.01 - TPV','2ºR.02 - AUTENTICAÇÃO','2ºR.03 - SEGUROS','2ºR.04 - NEGOCIAÇÃO','2ºR.05 - ACORDO','2ºR.06 - NPS','2ºR.07 - SUPER APP','2ºR.08 - MONITORAMENTO','2ºR.09 - PARCEIROS','2ºM.01 - INTEGRAÇÃO','2ºM.02 - NOME LIMPO','1ºO.01 - OFERTAS','1ºO.02 - SCORE','1ºO.03 - PIX'],
  PDC:['G19.01','R19.01','R19.02','R19.03','R19.04','R19.05','R19.06','R19.07','R19.08','R19.09','R19.10','R20.01','R20.02','R20.05','R20.06','R20.07','R21.Tomorrowland','R22.01','R22.03','R22.04','R22.05','R22.06','R22.07','R23.01','R23.02','R23.03','R23.04','R23.05','R23.06']
};
let local='', sala='', dados={}, checks={}, hist=[];

function toggleTheme(){
  const b=document.body, t=b.getAttribute('data-theme')==='light'?'dark':'light';
  b.setAttribute('data-theme',t); document.getElementById('themeBtn').textContent=t==='light'?'🌙':'☀️';
  localStorage.setItem('theme',t);
}

function checkLocal(){ document.getElementById('btnIniciar').disabled=!document.getElementById('selLocal').value; }

function iniciarRonda(){
  local=document.getElementById('selLocal').value;
  document.getElementById('step1').classList.add('hidden');
  document.getElementById('step2').classList.remove('hidden');
  renderSalas();
}

function renderSalas(){
  const l=document.getElementById('salasList'); l.innerHTML='';
  SALAS[local].forEach(s=>{
    const d=document.createElement('div'); d.className='card';
    d.innerHTML=`<b>${s}</b> ${dados[s]?'✅':'○'}`;
    if(!dados[s]) d.onclick=()=>abrirSala(s);
    l.appendChild(d);
  });
}

function abrirSala(s){
  sala=s; document.getElementById('salaNomeDisplay').textContent=s;
  document.getElementById('sectionChecklist').classList.remove('hidden');
  checks={}; updateChecksUI();
}

function setCheck(i,v){
  checks[i]=v; updateChecksUI();
  if(Object.keys(checks).length===4) document.getElementById('btnSalvarSala').disabled=false;
}

function updateChecksUI(){
  ['camera','audio','tv','cabos'].forEach(k=>{
    const v=checks[k];
    const prefix = k.substring(0,3);
    document.getElementById(`b-${prefix}-ok`).className='tb '+(v==='ok'?'ok-a':'');
    document.getElementById(`b-${prefix}-fail`).className='tb '+(v==='fail'?'fail-a':'');
  });
}

function concluirSala(){
  dados[sala]={...checks}; document.getElementById('sectionChecklist').classList.add('hidden');
  renderSalas();
}

function showPage(p){
  document.querySelectorAll('.page').forEach(pg=>pg.classList.add('hidden'));
  document.getElementById('page-'+p).classList.remove('hidden');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(p==='qrcode') { document.getElementById('t-qr').classList.add('active'); genQR(); }
  else if(p==='historico') document.getElementById('t-hist').classList.add('active');
  else document.getElementById('t-ronda').classList.add('active');
}

function genQR(){
  const g=document.getElementById('qrGrid'); g.innerHTML='';
  SALAS['BNU'].slice(0,6).forEach(s=>{
    const d=document.createElement('div'); d.className='qr-item'; d.id='qr-'+s.substring(0,5);
    g.appendChild(d); new QRCode(d,{text:s,width:80,height:80});
  });
}

const scanner = new Html5Qrcode("reader");
scanner.start({facingMode:"environment"},{fps:10,qrbox:250}, (txt)=>{
  if(SALAS[local] && SALAS[local].includes(txt)) abrirSala(txt);
});

if(localStorage.getItem('theme')==='dark') toggleTheme();
</script>
</body>
</html>
